name: Deploy Godot Web to GitHub Pages

on:
  push:
    branches:
      - main
      - agent/setup-godot-project-structure
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Bust Godot pack cache
        shell: bash
        run: |
          set -euo pipefail
          pack_name="index-${GITHUB_SHA::12}.pck"
          mv build/web/index.pck "build/web/${pack_name}"
          sed -i "s/\"executable\":\"index\"/\"executable\":\"index\",\"mainPack\":\"${pack_name}\"/" build/web/index.html
          sed -i "s/\"index.pck\":/\"${pack_name}\":/" build/web/index.html
          grep -F "\"mainPack\":\"${pack_name}\"" build/web/index.html

      - name: Upload Godot Web build
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
